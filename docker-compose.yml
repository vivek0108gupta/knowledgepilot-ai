# Local development stack. Values fall back to local-only defaults; override them in `.env`.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-knowledgepilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-knowledgepilot}
      POSTGRES_DB: ${POSTGRES_DB:-knowledgepilot}
    ports:
      # Host port 5434 by default, so it does not collide with a Postgres already on 5432.
      # Loopback only by default: the database is never reachable from other machines.
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./apps/api
    # Time to hand running ingestion jobs back to the queue before being stopped.
    stop_grace_period: 20s
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-knowledgepilot}:${POSTGRES_PASSWORD:-knowledgepilot}@db:5432/${POSTGRES_DB:-knowledgepilot}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Supabase Auth: the API verifies access tokens against the project's public signing keys.
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      SUPABASE_ISSUER: ${SUPABASE_ISSUER:-}
      # Supabase Storage. The secret key is given to the API only, never to the web app.
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-knowledgepilot-documents}
      SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-60}
      # OpenAI embeddings. Like the storage key, given to the API only, never to the web app.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4.1-mini}
      CHAT_TOP_K: ${CHAT_TOP_K:-5}
      CHAT_MAX_TOP_K: ${CHAT_MAX_TOP_K:-10}
      CHAT_MIN_SIMILARITY: ${CHAT_MIN_SIMILARITY:-0.2}
      CHAT_CONTEXT_TOKENS: ${CHAT_CONTEXT_TOKENS:-6000}
      CHAT_MAX_CHUNKS_PER_DOCUMENT: ${CHAT_MAX_CHUNKS_PER_DOCUMENT:-3}
      CHAT_HISTORY_MESSAGES: ${CHAT_HISTORY_MESSAGES:-10}
      CHAT_HISTORY_TOKENS: ${CHAT_HISTORY_TOKENS:-2000}
      CHAT_TEMPERATURE: ${CHAT_TEMPERATURE:-0.2}
      CHAT_MAX_OUTPUT_TOKENS: ${CHAT_MAX_OUTPUT_TOKENS:-1000}
      CHAT_TIMEOUT_SECONDS: ${CHAT_TIMEOUT_SECONDS:-45}
      CHAT_MAX_ATTEMPTS: ${CHAT_MAX_ATTEMPTS:-3}
      CHAT_STREAM_TIMEOUT_SECONDS: ${CHAT_STREAM_TIMEOUT_SECONDS:-120}
      RATE_LIMITS_ENABLED: ${RATE_LIMITS_ENABLED:-true}
      RATE_LIMIT_CHAT_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_MINUTE:-10}
      RATE_LIMIT_CHAT_PER_WORKSPACE_PER_MINUTE: ${RATE_LIMIT_CHAT_PER_WORKSPACE_PER_MINUTE:-60}
      RATE_LIMIT_SEARCH_PER_MINUTE: ${RATE_LIMIT_SEARCH_PER_MINUTE:-30}
      RATE_LIMIT_UPLOAD_PER_HOUR: ${RATE_LIMIT_UPLOAD_PER_HOUR:-10}
      MAX_CONCURRENT_GENERATIONS_PER_USER: ${MAX_CONCURRENT_GENERATIONS_PER_USER:-3}
      MAX_CONCURRENT_AI_OPERATIONS_PER_WORKSPACE: ${MAX_CONCURRENT_AI_OPERATIONS_PER_WORKSPACE:-10}
      MAX_INGESTION_JOBS_PER_WORKSPACE: ${MAX_INGESTION_JOBS_PER_WORKSPACE:-5}
      USER_DAILY_TOKEN_LIMIT: ${USER_DAILY_TOKEN_LIMIT:-500000}
      USER_DAILY_CHAT_LIMIT: ${USER_DAILY_CHAT_LIMIT:-200}
      WORKSPACE_MONTHLY_TOKEN_LIMIT: ${WORKSPACE_MONTHLY_TOKEN_LIMIT:-5000000}
      WORKSPACE_MONTHLY_COST_LIMIT: ${WORKSPACE_MONTHLY_COST_LIMIT:-10.00}
      CHAT_MAX_INPUT_TOKENS: ${CHAT_MAX_INPUT_TOKENS:-12000}
      USAGE_RESERVATION_TTL_SECONDS: ${USAGE_RESERVATION_TTL_SECONDS:-600}
      INGESTION_RESERVATION_TTL_SECONDS: ${INGESTION_RESERVATION_TTL_SECONDS:-3600}
      QUERY_RESERVATION_TTL_SECONDS: ${QUERY_RESERVATION_TTL_SECONDS:-120}
      USAGE_HEARTBEAT_SECONDS: ${USAGE_HEARTBEAT_SECONDS:-30}
      USAGE_SWEEP_INTERVAL_SECONDS: ${USAGE_SWEEP_INTERVAL_SECONDS:-60}
      USAGE_ALERT_THRESHOLD_PERCENT: ${USAGE_ALERT_THRESHOLD_PERCENT:-80}
      INGESTION_WORKERS_PER_WORKSPACE: ${INGESTION_WORKERS_PER_WORKSPACE:-2}
      INGESTION_MAX_ATTEMPTS: ${INGESTION_MAX_ATTEMPTS:-3}
      INGESTION_JOB_LEASE_SECONDS: ${INGESTION_JOB_LEASE_SECONDS:-600}
      INGESTION_RETRY_DELAY_SECONDS: ${INGESTION_RETRY_DELAY_SECONDS:-30}
      INGESTION_POLL_SECONDS: ${INGESTION_POLL_SECONDS:-5}
      INGESTION_SHUTDOWN_GRACE_SECONDS: ${INGESTION_SHUTDOWN_GRACE_SECONDS:-5}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-}
      USAGE_PRICING_JSON: ${USAGE_PRICING_JSON:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      CHUNK_SIZE_TOKENS: ${CHUNK_SIZE_TOKENS:-800}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-100}
      SEARCH_MAX_TOP_K: ${SEARCH_MAX_TOP_K:-20}
      SEARCH_MIN_SIMILARITY: ${SEARCH_MIN_SIMILARITY:-0.2}
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Ready means migrations ran, the database answers, and pgvector is installed.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        # The browser calls the API directly, so this is the host-facing URL.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:

[project]
name = "knowledgepilot-api"
version = "0.1.0"
description = "KnowledgePilot AI backend: documents, retrieval, and cited answers."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pyjwt[crypto]>=2.10",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-multipart>=0.0.18",
    "httpx>=0.27",
    "openai>=1.60",
    "pgvector>=0.3.6",
    "tiktoken>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# If a single test runs this long, print every thread's stack so a stall can be diagnosed.
# This does not stop or lengthen the test.
faulthandler_timeout = 120

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The local `alembic/` folder holds migrations; the import `alembic` is the installed package.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends"]
